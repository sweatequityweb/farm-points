<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e7d32">
<title>Ugnayan Gulayan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--pri:#2e7d32;--pri-d:#1b5e20;--bg:#f4f7f4;--card:#fff;--txt:#1b2a1d;--mut:#5f6f61;--line:#dfe7df;--pend:#f57f17;--ok:#2e7d32;--void:#c62828;--sh:0 1px 3px rgba(20,50,20,.12),0 1px 2px rgba(20,50,20,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}button:disabled{background:#9eb59f;cursor:not-allowed}.log a{display:inline-block;padding:12px 4px;color:var(--pri)}
body{margin:0;font-family:Roboto,system-ui,sans-serif;background:var(--bg);color:var(--txt);padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header{background:var(--pri);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;box-shadow:var(--sh)}
header h1{font-size:18px;margin:0;font-weight:500}header small{display:block;opacity:.85;font-size:12px}
main{max-width:960px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:12px;box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 10px;font-weight:500}
.grid{display:grid;gap:14px}@media(min-width:760px){.grid.two{grid-template-columns:1fr 1fr}}
button{font:inherit;min-height:48px;padding:0 20px;border-radius:24px;border:0;cursor:pointer;font-weight:500;background:var(--pri);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #81c784;outline-offset:2px}
button.ghost{background:transparent;color:var(--pri);border:1px solid var(--line)}button.red{background:var(--void)}button.sm{min-height:48px;padding:0 16px}
button.text{background:none;color:var(--pri);min-height:48px}
input,select,textarea{font:inherit;width:100%;min-height:48px;padding:10px 12px;border:1px solid #b9c6b9;border-radius:8px;background:#fff;color:var(--txt)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.chip{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:500;color:#fff}
.chip.pending{background:var(--pend)}.chip.approved{background:var(--ok)}.chip.voided{background:var(--void)}.chip.warn{background:#fff3e0;color:#e65100}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}.grow{flex:1}
.mut{color:var(--mut);font-size:13px}.log{padding:12px 0;border-top:1px solid var(--line)}.log:first-child{border-top:0}
.ring{display:block;margin:6px auto}.ring text{font-family:Roboto}
.hero{text-align:center}.hero .std{margin-top:4px}
.clock{position:sticky;bottom:calc(14px + env(safe-area-inset-bottom));z-index:4}
.clock button{width:100%;min-height:64px;font-size:20px;border-radius:32px;box-shadow:0 4px 14px rgba(20,60,20,.35)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;min-height:60px;font-size:12px;position:relative}
nav button.on{color:var(--pri);box-shadow:inset 0 3px 0 var(--pri)}
.badge{background:var(--void);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;margin-left:4px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px;max-height:90vh;overflow:auto}
@media(min-width:760px){#modal{align-items:center}.sheet{border-radius:16px}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:#263238;color:#fff;padding:12px 18px;border-radius:8px;z-index:30;display:none}
.center{min-height:80vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;padding:20px}
.center .card{width:100%;max-width:420px;text-align:left}
.bar{height:8px;background:#e3ebe3;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
@media(prefers-reduced-motion:no-preference){button{transition:filter .15s}button:active{filter:brightness(.9)}}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}.kpi div{background:var(--bg);border-radius:10px;padding:12px;font-size:13px;color:var(--mut)}.kpi b{display:block;font-size:22px;color:var(--txt)}@media(min-width:760px){.kpi{grid-template-columns:repeat(4,1fr)}}
.panel{background:var(--card);border-radius:12px;box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
.panel summary{list-style:none;min-height:64px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.panel summary::-webkit-details-marker{display:none}.panel summary small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.panel summary i{font-style:normal;color:var(--mut);font-size:20px;transition:transform .15s}.panel[open] summary i{transform:rotate(180deg)}
.pbody{padding:4px 16px 16px;border-top:1px solid var(--line)}.pbody .card{box-shadow:none;border:1px solid var(--line);padding:12px}
.blk{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;margin-bottom:10px}.blk.drag{box-shadow:0 8px 22px rgba(0,0,0,.25);position:relative;z-index:3}
.grip{touch-action:none;cursor:grab;font-size:28px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:var(--mut);user-select:none;flex:none}
textarea{resize:vertical;min-height:96px}
.chip.pod{background:#e8f5e9;color:var(--pri-d)}.chip.nopod{background:#eceff1;color:var(--mut)}
.sch{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:500;background:#eef5ee;color:var(--pri-d);border:1px solid #cfe0cf}
.slots{display:grid;grid-template-columns:minmax(84px,auto) 1fr 1fr;gap:8px;align-items:center}
.slot{background:#fff;color:var(--mut);border:1px solid #b9c6b9;border-radius:12px;padding:0 8px}
.slot.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.panel .panel{box-shadow:none;border:1px solid var(--line)}
.md h2{font-size:20px;margin:14px 0 6px}.md h3{font-size:17px;margin:12px 0 4px}.md h4{font-size:15px;margin:10px 0 4px}.md p,.md li{line-height:1.55;margin:6px 0}.md blockquote{border-left:3px solid var(--line);margin:8px 0;padding-left:12px;color:var(--mut)}.md code{background:var(--bg);padding:1px 5px;border-radius:4px}.md hr{border:0;border-top:1px solid var(--line)}
</style>
</head>
<body>
<header id="hdr" hidden><div><h1>Ugnayan Gulayan</h1><small id="sub"></small></div><button class="ghost" style="color:#fff;border-color:#ffffff66;min-height:40px" onclick="A.logout()">Sign out</button></header>
<main id="app"><div class="center">Loading…</div></main>
<nav id="nav" hidden></nav>
<div id="modal" onclick="if(event.target===this)A.close()"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script type="module">
/* ============ CONFIGURATION: paste your NEW Firebase project's config here ============ */
const firebaseConfig = {
  apiKey: "AIzaSyCUsIydJpEClSyKKavQ1QQsC1qU4s-So_4",
  authDomain: "farm-points-7ceb5.firebaseapp.com",
  projectId: "farm-points-7ceb5",
  storageBucket: "farm-points-7ceb5.firebasestorage.app",
  messagingSenderId: "204725381372",
  appId: "1:204725381372:web:f57b2a49a1d82364f1cf79"
};
const ADMIN_EMAIL = "admin@lla.edu", LIAISON_EMAIL = "farm@lla.edu";
/* ====================================================================================== */
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithPopup,GoogleAuthProvider,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,collection,onSnapshot,setDoc,updateDoc,deleteDoc,addDoc,getDocs,query,where,writeBatch,deleteField} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const DEF={targetStandard:120,targetAdjusted:90,pointsPerDay:8,onTrackStandard:75,onTrackAdjusted:60,directory:{},currentYear:'',yearEnd:'',pastYears:[],clockOpen:'04:00',clockClose:'19:00',maxShiftHours:8,slidesUrl:'',yearStart:'',terms:[{name:'Term 1',end:'',pct:25},{name:'Term 2',end:'',pct:50},{name:'Term 3',end:'',pct:75},{name:'Term 4',end:'',pct:100}]};
const S={user:null,role:null,profile:undefined,hh:{},att:[],users:[],cfg:{...DEF},tab:'approvals',unsubs:[],timer:null,showStaff:false,open:{year:true},ptab:'home',podHh:{},podAtt:[],_pod:null,podDraft:{},hsort:'id',hpod:'all'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isStaff=()=>S.role==='admin'||S.role==='liaison';
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmtT=iso=>iso?new Date(iso).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):'—';
const fmtD=s=>new Date(s+'T00:00').toLocaleDateString([], {month:'short',day:'numeric',year:'numeric'});
const hrs=h=>{const m=Math.round(h*60);return `${Math.floor(m/60)}h ${pad(m%60)}m`};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3000)};
const guard=fn=>async(...a)=>{try{return await fn(...a)}catch(e){console.error(e);toast('Error: '+(e.code||e.message))}};

/* ---------- derived data ---------- */
const yLabel=id=>String(id||'').replace('-','\u2013');
const inRange=(d,a,b)=>(!a||d>=a)&&(!b||d<=b);
const inYear=a=>inRange(a.date,S.cfg.yearStart,S.cfg.yearEnd);
const yearOver=()=>!!S.cfg.yearEnd&&ymd(new Date())>S.cfg.yearEnd;
const pts=id=>S.att.filter(a=>a.hhId===id&&a.status==='approved'&&inYear(a)).reduce((s,a)=>s+(a.points||0),0);
const target=h=>h?.targetType==='adjusted'?S.cfg.targetAdjusted:S.cfg.targetStandard;
function standing(h,p){const t=target(h),mid=h?.targetType==='adjusted'?S.cfg.onTrackAdjusted:S.cfg.onTrackStandard,today=ymd(new Date()),T=(S.cfg.terms||[]).filter(x=>x.end).sort((a,b)=>a.end>b.end?1:-1);
  if(!S.cfg.yearStart||today<S.cfg.yearStart)return['Not started',''];
  if(!T.length||S.cfg.yearEnd||today>T[T.length-1].end)return p>=t?['In Good Standing','approved']:p>=mid?['On Track','pending']:['Needs Support','voided'];
  const cur=T.find(x=>x.end>=today),thr=Math.round(t*cur.pct/100);
  return p>=thr?['Met '+cur.name+' pace','approved']:p>=thr*0.6?['Close to pace','pending']:['Behind pace','voided']}
const hhName=id=>S.hh[id]?.name||S.cfg.directory?.[id]||id;

/* ---------- pods + availability helpers ---------- */
const natCmp=(a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true});
const isNumPod=p=>/^\d+$/.test(String(p||''));
const podLabel=p=>p?(isNumPod(p)?'Pod '+p:String(p)):'No pod';
const podChip=p=>p?`<span class="chip pod">${esc(podLabel(p))}</span>`:'<span class="chip nopod">No pod</span>';
const podNums=()=>{const t=new Set((S.cfg.pods||[]).map(String));Object.values(S.hh).forEach(h=>{if(isNumPod(h.pod))t.add(String(h.pod))});return[...t].sort((a,b)=>a-b)};
const legacyPods=()=>[...new Set(Object.values(S.hh).map(h=>h.pod).filter(p=>p&&!isNumPod(p)))];
const OLD_ORDER=['Mon AM','Wed PM','Thu AM','Thu PM','Fri AM','Sat AM A','Sat AM B','Sun AM','Sun PM'];
const DAYS=[['Mon','Monday'],['Tue','Tuesday'],['Wed','Wednesday'],['Thu','Thursday'],['Fri','Friday'],['Sat','Saturday'],['Sun','Sunday']];
const slotName=k=>{const[d,t]=k.split('-'),f=DAYS.find(x=>x[0]===d);return f?f[1]+' '+(t==='AM'?'morning':'afternoon'):k};
const slotOrd=k=>{const[d,t]=k.split('-');return DAYS.findIndex(x=>x[0]===d)*2+(t==='PM'?1:0)};
function availLabels(av){const s=new Set(av||[]);return DAYS.flatMap(([d])=>{const a=s.has(d+'-AM'),p=s.has(d+'-PM');return a&&p?[d+' all day']:a?[d+' morning']:p?[d+' afternoon']:[]})}
const availChips=av=>{const L=availLabels(av);return L.length?L.map(l=>`<span class="sch">${l}</span>`).join(''):'<span class="mut">No schedule set</span>'};
const availText=av=>{const L=availLabels(av);return L.length?'Available: '+L.join(', '):'No schedule set'};
const slotGrid=(id,av)=>`<div class="slots">${DAYS.map(([d,full])=>`<span>${full}</span>${['AM','PM'].map(t=>{const k=d+'-'+t,on=(av||[]).includes(k);return `<button type="button" class="slot${on?' on':''}" data-k="${k}" aria-pressed="${on}" onclick="A.toggleSlot('${id}',this)">${t==='AM'?'Morning':'Afternoon'}</button>`}).join('')}`).join('')}</div>`;
function glance(ids,map,card){const n=ids.length,cnt={};ids.forEach(i=>(map[i]?.availability||[]).forEach(k=>cnt[k]=(cnt[k]||0)+1));
  const rows=Object.entries(cnt).sort((a,b)=>b[1]-a[1]||slotOrd(a[0])-slotOrd(b[0]));if(!rows.length)return'';
  const body=rows.map(([k,c])=>`<div style="margin:8px 0"><div class="row sp"><span>${slotName(k)}</span><span class="mut">${c} of ${n}</span></div><div class="bar"><i style="width:${c/n*100}%"></i></div></div>`).join('');
  return card?`<div class="card"><h2>When your pod is free</h2><p class="mut" style="margin-top:0">Times most podmates can come are listed first.</p>${body}</div>`:`<div style="margin-top:12px"><div class="mut"><b>Pod overlap</b></div>${body}</div>`}
const SORTS={id:'Household ID',ptsDesc:'Most points',ptsAsc:'Fewest points',newest:'Newest added',name:'Name A\u2013Z',pod:'Pod'};
function hhSorted(){let ids=Object.keys(S.hh);const P={};ids.forEach(i=>P[i]=pts(i));const f=S.hpod||'all',k=S.hsort||'id';
  if(f==='none')ids=ids.filter(i=>!S.hh[i].pod);else if(f!=='all')ids=ids.filter(i=>String(S.hh[i].pod||'')===f);
  const pn=i=>isNumPod(S.hh[i].pod)?+S.hh[i].pod:S.hh[i].pod?9998:9999;
  const C={id:natCmp,ptsDesc:(a,b)=>P[b]-P[a]||natCmp(a,b),ptsAsc:(a,b)=>P[a]-P[b]||natCmp(a,b),newest:(a,b)=>(S.hh[b].createdAt||0)-(S.hh[a].createdAt||0)||natCmp(b,a),name:(a,b)=>String(S.hh[a].name||'').localeCompare(String(S.hh[b].name||''))||natCmp(a,b),pod:(a,b)=>pn(a)-pn(b)||natCmp(a,b)};
  return{ids:ids.sort(C[k]||natCmp),P}}

/* ---------- auth + subscriptions ---------- */
function clearSubs(){S.unsubs.forEach(u=>u());S.unsubs=[];clearInterval(S.timer)}
const sub=(ref,cb)=>S.unsubs.push(onSnapshot(ref,cb,e=>{console.error(e);toast('Permission or network error: '+e.code)}));
onAuthStateChanged(auth,user=>{
  clearSubs();S.user=user;S.profile=undefined;S.hh={};S.att=[];S.users=[];S.podHh={};S.podAtt=[];S._pod=null;S._hhSub=false;S.years=[];S.events=[];
  if(!user){S.role=null;return render()}
  const em=(user.email||'').toLowerCase();
  S.role=em===ADMIN_EMAIL?'admin':em===LIAISON_EMAIL?'liaison':'parent';
  sub(doc(db,'config','program'),s=>{S.cfg={...DEF,...(s.data()||{})};const tt=S.cfg.terms||[];if(tt.length===3&&tt.every(t=>!t.end)&&tt.map(t=>t.pct).join()==='33,66,100')S.cfg.terms=DEF.terms;render()});
  if(isStaff()){
    S.profile={status:'active'};
    sub(collection(db,'households'),s=>{S.hh={};s.forEach(d=>S.hh[d.id]=d.data());render()});
    sub(collection(db,'attendance'),s=>{S.att=s.docs.map(d=>({id:d.id,...d.data()}));render()});
    sub(collection(db,'users'),s=>{S.users=s.docs.map(d=>({id:d.id,...d.data()}));S.users.forEach(u=>sweep(u.id,u));render()});
    if(S.role==='admin'){sub(collection(db,'years'),s=>{S.years=s.docs.map(d=>d.data());render()});sub(collection(db,'yearEvents'),s=>{S.events=s.docs.map(d=>({id:d.id,...d.data()}));render()})}
  }else{
    sub(doc(db,'users',user.uid),s=>{
      S.profile=s.exists()?s.data():null;sweep(user.uid,S.profile);
      if(S.profile?.status==='active'&&S.profile.householdId&&!S._hhSub){
        S._hhSub=true;const id=S.profile.householdId;
        sub(doc(db,'households',id),x=>{S.hh={[id]:x.data()};const pd=x.data()?.pod;
          if(pd&&S._pod!==pd){S._pod=pd;
            sub(query(collection(db,'households'),where('pod','==',pd)),y=>{S.podHh={};y.forEach(d=>S.podHh[d.id]=d.data());render()});
            sub(query(collection(db,'attendance'),where('pod','==',pd)),y=>{S.podAtt=y.docs.map(d=>d.data());render()})}
          render()});
        sub(query(collection(db,'attendance'),where('hhId','==',id)),x=>{S.att=x.docs.map(d=>({id:d.id,...d.data()}));render()});
      }
      render();
    });
  }
});

/* ---------- rendering ---------- */
function render(){
  const app=$('#app'),nav=$('#nav'),hdr=$('#hdr');
  clearInterval(S.timer);
  if(!S.user){hdr.hidden=nav.hidden=true;return app.innerHTML=loginView()}
  if(S.profile===undefined){hdr.hidden=nav.hidden=true;return app.innerHTML='<div class="center">Loading…</div>'}
  hdr.hidden=false;
  $('#sub').textContent=S.user.email+' · '+({admin:'Admin',liaison:'Farm Liaison',parent:'Household'}[S.role]);
  if(isStaff()){nav.hidden=false;return staffView()}
  nav.hidden=true;nav.innerHTML='';
  if(!S.profile)return app.innerHTML=claimView();
  if(S.profile.status!=='active')return app.innerHTML=`<div class="center"><div style="font-size:56px">🌱</div><h2>Waiting for approval</h2><p class="mut" style="max-width:320px">Your request to join household <b>${esc(hhName(S.profile.householdId))}</b> was sent. The Farm Liaison will confirm it. This screen updates by itself.</p><button class="ghost" onclick="A.cancelClaim()">Choose a different household</button></div>`;
  nav.hidden=false;nav.innerHTML=[['home','Home'],['pod','My pod'],['program','Program']].map(([k,l])=>`<button class="${S.ptab===k?'on':''}" onclick="S_.ptab='${k}';A.r()">${l}</button>`).join('');
  parentView();
}
function loginView(){return `<div class="center"><div style="font-size:64px">🥬</div><h1 style="margin:0;color:var(--pri-d)">Ugnayan Gulayan</h1><p class="mut">Farm attendance and points for Noah Scholarship households</p>
<button style="width:100%;max-width:340px;min-height:56px" onclick="A.google()">Sign in with Google</button>
${S.showStaff?`<div class="card"><h2>Staff sign in</h2><label>Email</label><input id="em" type="email" autocomplete="username"><label>Password</label><input id="pw" type="password" autocomplete="current-password"><div style="margin-top:14px"><button style="width:100%" onclick="A.emailLogin()">Sign in</button></div></div>`:`<button class="text" onclick="S_.showStaff=true;A.r()">Staff sign in</button>`}</div>`}
function claimView(){
  const dir=Object.entries(S.cfg.directory||{}).sort();
  return `<div class="center"><div class="card"><h2>Claim your household</h2><p class="mut">Select your family name from the list.</p>
  ${dir.length?`<select id="hhSel"><option value="">Choose…</option>${dir.map(([id,n])=>`<option value="${id}">${esc(n)} (${id})</option>`).join('')}</select><div style="margin-top:14px"><button style="width:100%" onclick="A.claim()">Send request</button></div>`:`<p>The household list isn't loaded yet. Ask the Admin to import the scholar data.</p>`}</div></div>`}

function logHtml(a,opts={}){
  const low=a.durationHours<2&&a.status==='pending';
  return `<div class="log"><div class="row sp"><b>${opts.hh?esc(hhName(a.hhId))+' · ':''}${fmtD(a.date)}</b><span class="chip ${a.status}">${a.status}${a.status==='approved'?' +'+a.points:''}</span></div>
  <div class="mut">${a.kind==='buyout'?'Buy-out · '+esc(a.item)+' · '+a.days+' day(s) equivalent':fmtT(a.timeIn)+' – '+fmtT(a.timeOut)+' · '+hrs(a.durationHours||0)+(a.note?' · '+esc(a.note):'')}</div>
  ${low?'<span class="chip warn">Under 2 hours: earns 0 points</span>':''}${a.autoClosed?'<span class="chip warn">Auto-closed: times need checking</span>':''}${opts.actions||''}${isStaff()&&a.kind!=='buyout'?`<div><button class="text" onclick="A.editModal('${a.id}')">Edit times or note</button></div>`:''}</div>`}

function parentView(){if(S.ptab==='program')return programView();if(S.ptab==='pod')return podView();
  const id=S.profile.householdId,h=S.hh[id]||{},p=pts(id),t=target(h),[st,cls]=standing(h,p);
  const open=S.profile.activeClockIn,C=2*Math.PI*90,frac=Math.min(p/t,1);
  const mine=S.att.filter(inYear).sort((a,b)=>b.timeIn>a.timeIn?1:-1);

  const s3=XLSX.utils.json_to_sheet(L.map(a=>({Type:a.kind||'work',Date:a.date,'Household ID':a.hhId,Pod:a.pod||'','Time In':fmtT(a.timeIn),'Time Out':fmtT(a.timeOut),Hours:a.durationHours||0,Note:a.note||'',Points:a.points||0,Status:a.status,'Approved by':a.approvedBy||''})));s3['!cols']=Array(11).fill({wch:14});XLSX.utils.book_append_sheet(wb,s3,'Attendance Logs');
  XLSX.writeFile(wb,`ugnayan-gulayan-${id||'all'}.xlsx`)})
});
const uid=()=>Math.random().toString(36).slice(2,8);
function md(src){const E=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const inl=t=>E(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const out=[];let list=null,para=[];const flush=()=>{if(para.length){out.push('<p>'+inl(para.join(' '))+'</p>');para=[]}},endL=()=>{if(list){out.push('</'+list+'>');list=null}};
  for(const raw of String(src||'').split('\n')){const l=raw.trimEnd();let m;
    if(!l.trim()){flush();endL();continue}
    if(m=/^(#{1,3})\s+(.*)$/.exec(l)){flush();endL();out.push('<h'+(m[1].length+1)+'>'+inl(m[2])+'</h'+(m[1].length+1)+'>')}
    else if(/^(-{3,}|\*{3,})$/.test(l.trim())){flush();endL();out.push('<hr>')}
    else if(m=/^\s*[-*]\s+(.*)$/.exec(l)){flush();if(list!=='ul'){endL();out.push('<ul>');list='ul'}out.push('<li>'+inl(m[1])+'</li>')}
    else if(m=/^\s*\d+[.)]\s+(.*)$/.exec(l)){flush();if(list!=='ol'){endL();out.push('<ol>');list='ol'}out.push('<li>'+inl(m[1])+'</li>')}
    else if(m=/^>\s?(.*)$/.exec(l)){flush();endL();out.push('<blockquote>'+inl(m[1])+'</blockquote>')}
    else{endL();para.push(l.trim())}}
  flush();endL();return out.join('')}
function programHtml(bl){return bl.length?bl.map(b=>{const u=b.type==='slides'?slideEmbed(b.url):'';
  return `<div class="card">${b.title?`<h2>${esc(b.title)}</h2>`:''}${u?`<div style="position:relative;padding-top:56.25%;border-radius:8px;overflow:hidden"><iframe src="${esc(u)}" style="position:absolute;inset:0;width:100%;height:100%;border:0" allowfullscreen title="${esc(b.title||'Slides')}"></iframe></div><p><a href="${esc(b.url)}" target="_blank" rel="noopener">Open in Google Slides</a></p>`:''}${b.md?`<div class="md">${md(b.md)}</div>`:''}</div>`}).join(''):'<div class="card"><p class="mut">Nothing has been added yet.</p></div>'}
function initBlocks(){return JSON.parse(JSON.stringify(S.cfg.programBlocks??(S.cfg.slidesUrl?[{id:uid(),type:'slides',title:'About the program',url:S.cfg.slidesUrl,md:''}]:[]))).map(b=>({id:b.id||uid(),type:b.type,title:b.title||'',url:b.url||'',md:b.md||''}))}
function blocksHtml(){S.pb??=initBlocks();const bt='style="padding:0 14px"';
  return S.pb.map((b,i)=>`<div class="blk" data-i="${i}" data-id="${b.id}"><div class="row" style="flex-wrap:nowrap;gap:4px"><span class="grip" data-grip role="button" aria-label="Drag to reorder">\u2807</span><span class="chip ${b.type==='slides'?'approved':'pending'}">${b.type==='slides'?'Slides':'Text'}</span><span class="grow"></span><button class="ghost sm" ${bt} aria-label="Move up" onclick="A.moveBlk(${i},-1)">\u25b2</button><button class="ghost sm" ${bt} aria-label="Move down" onclick="A.moveBlk(${i},1)">\u25bc</button><button class="ghost sm" ${bt} aria-label="Delete block" onclick="A.delBlk(${i})">\u2715</button></div>
  <label>Title (optional)</label><input value="${esc(b.title)}" oninput="A.setBlk(${i},'title',this.value)">
  ${b.type==='slides'?`<label>Google Slides link</label><input value="${esc(b.url)}" inputmode="url" placeholder="https://docs.google.com/presentation/d/..." oninput="A.setBlk(${i},'url',this.value)">`:''}
  <label>${b.type==='slides'?'Description (Markdown, optional)':'Text (Markdown)'}</label><textarea rows="${b.type==='slides'?3:6}" oninput="A.setBlk(${i},'md',this.value)">${esc(b.md)}</textarea></div>`).join('')||'<p class="mut">No blocks yet. Add slides or text below.</p>'}
const redrawBlk=()=>{const b=$('#blkBox');if(b)b.innerHTML=blocksHtml()};
const pan=(k,t,sub,body)=>`<details class="panel" ${S.open[k]?'open':''} ontoggle="S_.open['${k}']=this.open"><summary><span><b>${t}</b><small>${sub}</small></span><i>\u25be</i></summary><div class="pbody">${body}</div></details>`;
function settingsHtml(){const c=S.cfg,nb=(S.pb||initBlocks()).length;
  return pan('year','Program year',c.currentYear?yLabel(c.currentYear)+(c.yearEnd?' \u00b7 ended':' \u00b7 open'):'Not started',yearsView())
  +pan('targets','Points and targets','Standard '+c.targetStandard+' \u00b7 Adjusted '+c.targetAdjusted,`<label>Standard target (points)</label><input id="tS" type="number" inputmode="numeric" value="${c.targetStandard}"><label>Adjusted target (points)</label><input id="tA" type="number" inputmode="numeric" value="${c.targetAdjusted}"><label>Points per work day</label><input id="tP" type="number" inputmode="numeric" value="${c.pointsPerDay}"><label>On Track from (standard / adjusted)</label><div class="row" style="flex-wrap:nowrap"><input id="oS" type="number" inputmode="numeric" value="${c.onTrackStandard}"><input id="oA" type="number" inputmode="numeric" value="${c.onTrackAdjusted}"></div><div style="margin-top:14px"><button onclick="A.saveCfg()">Save</button></div>`)
  +pan('clock','Clock-in',c.clockOpen+' to '+c.clockClose,`<label>Clock-in opens</label><input id="cO" type="time" value="${c.clockOpen}"><label>Clock-in closes</label><input id="cC" type="time" value="${c.clockClose}"><label>Auto-close open sessions after (hours)</label><input id="cM" type="number" inputmode="numeric" value="${c.maxShiftHours}"><div style="margin-top:14px"><button onclick="A.saveClock()">Save</button></div>`)
  +pan('terms','Terms',(c.terms||[]).length+' terms',`<p class="mut">Name, end date, and % of the target due by then. End dates are optional for now.</p><div id="termsBox">${termsHtml()}</div><div class="row"><button class="ghost sm" onclick="A.addTerm()">+ Add term</button><button class="ghost sm" onclick="A.evenTerms()">Spread evenly</button></div><div style="margin-top:14px"><button onclick="A.saveTerms()">Save</button></div>`)
  +pan('page','Program page',nb+' block'+(nb===1?'':'s'),`<p class="mut">Households see these blocks in this order. Drag the handle \u2807 or use \u25b2 \u25bc to reorder. Text supports Markdown: <code># Heading</code>, <code>**bold**</code>, <code>- list</code>, <code>[link](https://...)</code>.</p><div id="blkBox">${blocksHtml()}</div><div class="row"><button class="ghost" onclick="A.addBlk('slides')">+ Slides</button><button class="ghost" onclick="A.addBlk('text')">+ Text</button></div><div class="row" style="margin-top:14px"><button onclick="A.saveBlocks()">Save</button><button class="ghost" onclick="A.previewBlocks()">Preview</button></div>`)
  +pan('data','Excel and pods','Import, export, load pods',`<p class="mut">Import the scholar sheet "Sorted by Barangay". Existing households keep their target type.</p><input id="xf" type="file" accept=".xlsx,.xls"><div class="row" style="margin-top:12px"><button onclick="A.importXlsx()">Import</button><button class="ghost" onclick="A.exportXlsx()">Export year</button><button class="ghost" onclick="A.seedPods()">Load pods</button></div>`)}
Object.assign(A,{
 setBlk:(i,k,v)=>{if(S.pb&&S.pb[i])S.pb[i][k]=v},
 addBlk:t=>{S.pb??=initBlocks();S.pb.push({id:uid(),type:t,title:'',url:'',md:''});redrawBlk();const l=$('#blkBox').lastElementChild;if(l)l.scrollIntoView({behavior:'smooth',block:'center'})},
 delBlk:i=>{const b=S.pb[i];if((b.title||b.url||b.md)&&!confirm('Delete this block?'))return;S.pb.splice(i,1);redrawBlk()},
 moveBlk:(i,d)=>{const j=i+d;if(j<0||j>=S.pb.length)return;[S.pb[i],S.pb[j]]=[S.pb[j],S.pb[i]];redrawBlk()},
 previewBlocks:()=>open_(`<div class="row sp"><h2 style="margin:0">Preview</h2><button class="text" onclick="A.close()">Close</button></div><p class="mut">This is how households will see it.</p>${programHtml((S.pb||initBlocks()).filter(b=>b.title||b.md||slideEmbed(b.url)))}`),
 saveBlocks:guard(async()=>{const bl=(S.pb||initBlocks()).map(b=>({id:b.id,type:b.type,title:b.title.trim(),url:b.type==='slides'?b.url.trim():'',md:b.md.trim()}));
   const bad=bl.findIndex(b=>b.type==='slides'?!slideEmbed(b.url):!(b.title||b.md));
   if(bad>=0)return toast(bl[bad].type==='slides'?'Block '+(bad+1)+': add a valid Google Slides link':'Block '+(bad+1)+' is empty');
   await setDoc(doc(db,'config','program'),{programBlocks:bl},{merge:true});S.pb=null;A.r();toast('Program page saved')}),
 saveClock:guard(async()=>{await setDoc(doc(db,'config','program'),{clockOpen:$('#cO').value,clockClose:$('#cC').value,maxShiftHours:+$('#cM').value},{merge:true});toast('Clock-in saved')}),
 saveTerms:guard(async()=>{let terms=(S.td||S.cfg.terms||[]).map((t,i)=>({name:String(t.name||'').trim()||'Term '+(i+1),end:t.end||'',pct:+t.pct||0}));const dated=terms.every(t=>t.end);
   if(terms.some(t=>t.end&&!(t.pct>0&&t.pct<=100)))return toast('A term with an end date needs a % from 1 to 100');
   if(dated)terms=terms.sort((a,b)=>a.end>b.end?1:-1);
   if(dated&&terms.length&&terms[terms.length-1].pct!==100&&!confirm('The last term is not 100% of the target. Save anyway?'))return;
   await setDoc(doc(db,'config','program'),{terms},{merge:true});S.td=null;A.r();toast('Terms saved')})
});
document.addEventListener('pointerdown',e=>{const g=e.target.closest&&e.target.closest('[data-grip]');if(!g||S.role!=='admin')return;e.preventDefault();
  const box=$('#blkBox'),el=g.closest('.blk');if(!box||!el)return;el.classList.add('drag');g.setPointerCapture(e.pointerId);
  const mv=ev=>{const y=ev.clientY;if(y<90)scrollBy(0,-14);else if(y>innerHeight-90)scrollBy(0,14);const nx=[...box.children].filter(c=>c!==el).find(c=>{const r=c.getBoundingClientRect();return y<r.top+r.height/2});box.insertBefore(el,nx||null)};
  const up=()=>{g.removeEventListener('pointermove',mv);g.removeEventListener('pointerup',up);g.removeEventListener('pointercancel',up);S.pb=[...box.children].map(c=>S.pb.find(b=>b.id===c.dataset.id));redrawBlk()};
  g.addEventListener('pointermove',mv);g.addEventListener('pointerup',up);g.addEventListener('pointercancel',up)});
