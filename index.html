.l1{background:#dcefd9!important}.l2{background:#b9dfb4!important}.l3{background:#86c97f!important}.l4{background:#4f9f4a!important;color:#fff!important}.l4 .dn{color:#e8f5e9!important}
.dc.out{opacity:.45}.dc.today{border-color:var(--pri)}.dc.sel{box-shadow:0 0 0 3px #1b5e20;border-color:#fff}
.sw{display:inline-block;width:18px;height:18px;border-radius:5px}.dot{display:inline-block;width:10px;height:10px;border-radius:5px;vertical-align:middle}

.claim{max-width:440px}.logo{width:64px;height:64px;border-radius:20px;background:var(--pc);display:inline-flex;align-items:center;justify-content:center;font-size:32px}

button.pick{width:100%;min-height:56px;border-radius:0;background:transparent;color:var(--txt);display:flex;align-items:center;justify-content:flex-start;gap:14px;padding:8px 16px;text-align:left;font-weight:400;font-size:15px;border-bottom:1px solid var(--line);filter:none}
button.pick:last-child{border-bottom:0}button.pick.on{background:var(--pc);color:var(--on-pc)}button.pick:hover{background:var(--scl)}button.pick.on:hover{background:var(--pc)}
.rd{flex:none;width:20px;height:20px;border-radius:10px;border:2px solid var(--ol)}.pick.on .rd{border-color:var(--pri);background:radial-gradient(var(--pri) 0 45%,transparent 50%)}
</style>

<script type="module">
/* ============ CONFIGURATION: paste your NEW Firebase project's config here ============ */
const firebaseConfig = {
  apiKey: "AIzaSyCUsIydJpEClSyKKavQ1QQsC1qU4s-So_4",
  authDomain: "farm-points-7ceb5.firebaseapp.com",
  projectId: "farm-points-7ceb5",
  storageBucket: "farm-points-7ceb5.firebasestorage.app",
  messagingSenderId: "204725381372",
  appId: "1:204725381372:web:f57b2a49a1d82364f1cf79"
};
const ADMIN_EMAIL = "admin@lla.edu", LIAISON_EMAIL = "farm@lla.edu";
/* ====================================================================================== */
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithPopup,GoogleAuthProvider,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,collection,onSnapshot,setDoc,updateDoc,deleteDoc,addDoc,getDocs,query,where,writeBatch,deleteField} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const DEF={targetStandard:120,targetAdjusted:90,pointsPerDay:8,onTrackStandard:75,onTrackAdjusted:60,directory:{},currentYear:'',yearEnd:'',pastYears:[],clockOpen:'04:00',clockClose:'19:00',maxShiftHours:8,guestPoints:2,maxGuests:5,slidesUrl:'',yearStart:'',terms:[{name:'Term 1',end:'',pct:25},{name:'Term 2',end:'',pct:50},{name:'Term 3',end:'',pct:75},{name:'Term 4',end:'',pct:100}]};
const S={user:null,role:null,profile:undefined,hh:{},att:[],users:[],cfg:{...DEF},tab:'approvals',unsubs:[],timer:null,showStaff:false,open:{year:true},ptab:'home',podHh:{},podAtt:[],_pod:null,podDraft:{},winDraft:{},hsort:'id',hpod:'all',contacts:{},pp:{},holders:{},myContact:null,myPp:null,podContacts:{},podPts:{},reqFrom:[],reqTo:[],harv:[],plant:[],fstats:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isStaff=()=>S.role==='admin'||S.role==='liaison';
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmtT=iso=>iso?new Date(iso).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):'—';
const fmtD=s=>new Date(s+'T00:00').toLocaleDateString([], {month:'short',day:'numeric',year:'numeric'});
const hrs=h=>{const m=Math.round(h*60);return `${Math.floor(m/60)}h ${pad(m%60)}m`};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3000)};
const guard=fn=>async(...a)=>{try{return await fn(...a)}catch(e){console.error(e);toast('Error: '+(e.code||e.message))}};

/* ---------- derived data ---------- */
/* Normalise a date that may be a string, Date, number, Firestore Timestamp
   or full ISO string, so year-window comparisons never silently fail. */
const toD=v=>{if(!v)return'';if(typeof v==='string')return v.slice(0,10);if(typeof v==='number')return ymd(new Date(v));
  if(v.toDate)return ymd(v.toDate());if(v.seconds!==undefined)return ymd(new Date(v.seconds*1000));
  if(v instanceof Date)return ymd(v);return String(v).slice(0,10)};
const yLabel=id=>String(id||'').replace('-','\u2013');
const inRange=(d,a,b)=>{d=toD(d);a=toD(a);b=toD(b);return(!a||d>=a)&&(!b||d<=b)};
const inYear=a=>inRange(a.date,S.cfg.yearStart,S.cfg.yearEnd);
const yearOver=()=>!!S.cfg.yearEnd&&ymd(new Date())>toD(S.cfg.yearEnd);
const pts=id=>S.att.filter(a=>a.hhId===id&&a.status==='approved'&&inYear(a)).reduce((s,a)=>s+(a.points||0),0);
const target=h=>h?.targetType==='adjusted'?S.cfg.targetAdjusted:S.cfg.targetStandard;
function standing(h,p){const t=target(h),mid=h?.targetType==='adjusted'?S.cfg.onTrackAdjusted:S.cfg.onTrackStandard,today=ymd(new Date()),T=(S.cfg.terms||[]).filter(x=>x.end).sort((a,b)=>a.end>b.end?1:-1);
  if(!S.cfg.yearStart||today<S.cfg.yearStart)return['Not started',''];
  if(!T.length||S.cfg.yearEnd||today>T[T.length-1].end)return p>=t?['In Good Standing','approved']:p>=mid?['On Track','pending']:['Needs Support','voided'];
  const cur=T.find(x=>x.end>=today),thr=Math.round(t*cur.pct/100);
  return p>=thr?['Met '+cur.name+' pace','approved']:p>=thr*0.6?['Close to pace','pending']:['Behind pace','voided']}
const hhName=id=>S.hh[id]?.name||S.cfg.directory?.[id]||id;

/* ---------- pods + availability helpers ---------- */
const natCmp=(a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true});
const isNumPod=p=>/^\d+$/.test(String(p||''));
const podLabel=p=>p?(isNumPod(p)?'Pod '+p:String(p)):'No pod';
const podChip=p=>p?`<span class="chip pod">${esc(podLabel(p))}</span>`:'<span class="chip nopod">No pod</span>';
const podNums=()=>{const t=new Set((S.cfg.pods||[]).map(String));Object.values(S.hh).forEach(h=>{if(isNumPod(h.pod))t.add(String(h.pod))});return[...t].sort((a,b)=>a-b)};
const legacyPods=()=>[...new Set(Object.values(S.hh).map(h=>h.pod).filter(p=>p&&!isNumPod(p)))];
const DAYS=[['Mon','Monday'],['Tue','Tuesday'],['Wed','Wednesday'],['Thu','Thursday'],['Fri','Friday'],['Sat','Saturday'],['Sun','Sunday']];
const slotName=k=>{const[d,t]=k.split('-'),f=DAYS.find(x=>x[0]===d);return f?f[1]+' '+(t==='AM'?'morning':'afternoon'):k};
const slotOrd=k=>{const[d,t]=k.split('-');return DAYS.findIndex(x=>x[0]===d)*2+(t==='PM'?1:0)};
function availLabels(av){const s=new Set(av||[]);return DAYS.flatMap(([d])=>{const a=s.has(d+'-AM'),p=s.has(d+'-PM');return a&&p?[d+' all day']:a?[d+' morning']:p?[d+' afternoon']:[]})}
const availChips=av=>{const L=availLabels(av);return L.length?L.map(l=>`<span class="sch">${l}</span>`).join(''):'<span class="mut">No schedule set</span>'};
const availText=av=>{const L=availLabels(av);return L.length?'Available: '+L.join(', '):'No schedule set'};
const slotGrid=(id,av)=>`<div class="slots">${DAYS.map(([d,full])=>`<span>${full}</span>${['AM','PM'].map(t=>{const k=d+'-'+t,on=(av||[]).includes(k);return `<button type="button" class="slot${on?' on':''}" data-k="${k}" aria-pressed="${on}" onclick="A.toggleSlot('${id}',this)">${t==='AM'?'Morning':'Afternoon'}</button>`}).join('')}`).join('')}</div>`;
function glance(ids,map,card){const n=ids.length,cnt={};ids.forEach(i=>(map[i]?.availability||[]).forEach(k=>cnt[k]=(cnt[k]||0)+1));
  const rows=Object.entries(cnt).sort((a,b)=>b[1]-a[1]||slotOrd(a[0])-slotOrd(b[0]));if(!rows.length)return'';
  const body=rows.map(([k,c])=>`<div style="margin:8px 0"><div class="row sp"><span>${slotName(k)}</span><span class="mut">${c} of ${n}</span></div><div class="bar"><i style="width:${c/n*100}%"></i></div></div>`).join('');
  return card?`<div class="card"><h2>When your pod is free</h2><p class="mut" style="margin-top:0">Times most podmates can come are listed first.</p>${body}</div>`:`<div style="margin-top:12px"><div class="mut"><b>Pod overlap</b></div>${body}</div>`}
const fmt12=t=>{const[h,m]=String(t||'').split(':');if(!h)return'';const n=+h;return((n+11)%12+1)+':'+m+' '+(n<12?'AM':'PM')};

document.addEventListener('pointerdown',e=>{const g=e.target.closest&&e.target.closest('[data-grip]');if(!g||S.role!=='admin')return;e.preventDefault();
  const box=$('#blkBox'),el=g.closest('.blk');if(!box||!el)return;el.classList.add('drag');g.setPointerCapture(e.pointerId);
  const mv=ev=>{const y=ev.clientY;if(y<90)scrollBy(0,-14);else if(y>innerHeight-90)scrollBy(0,14);const nx=[...box.children].filter(c=>c!==el).find(c=>{const r=c.getBoundingClientRect();return y<r.top+r.height/2});box.insertBefore(el,nx||null)};
  const up=()=>{g.removeEventListener('pointermove',mv);g.removeEventListener('pointerup',up);g.removeEventListener('pointercancel',up);S.pb=[...box.children].map(c=>S.pb.find(b=>b.id===c.dataset.id));redrawBlk()};
  g.addEventListener('pointermove',mv);g.addEventListener('pointerup',up);g.addEventListener('pointercancel',up)});
const guestBonus=l=>Math.min(Math.max(+l.guests||0,0),S.cfg.maxGuests)*S.cfg.guestPoints;
const HDEST={feeding:'Fed to scholars',sold:'Sold',shared:'Shared with households',other:'Other'};
const DEFCROPS=['Ampalaya','Kalabasa','Patola','Kamatis','Cherry tomato','Mustasa','Okra','Talong','Sitaw','Pechay','Kangkong','Sili','Upo','Mais','Saging'];
const cropList=()=>[...new Set([...(S.cfg.crops&&S.cfg.crops.length?S.cfg.crops:DEFCROPS),...S.harv.map(h=>h.crop)].filter(Boolean))].sort();
const hInYear=h=>inRange(h.date,S.cfg.yearStart,S.cfg.yearEnd);
const cap1=t=>{t=String(t||'').trim().replace(/\s+/g,' ');return t?t[0].toUpperCase()+t.slice(1):''};
const qtyText=c=>[c.kg?c.kg+' kg':'',c.pcs?c.pcs+' pcs':'',c.bundle?c.bundle+' bundles':''].filter(Boolean).join(' \u00b7 ');
function calcStats(){const H=S.harv.filter(hInYear),by={},dest={};let tk=0;
  H.forEach(h=>{const c=by[h.crop]??={kg:0,pcs:0,bundle:0};c[h.unit]=(c[h.unit]||0)+(+h.qty||0);if(h.unit==='kg'){tk+=+h.qty||0;dest[h.dest]=(dest[h.dest]||0)+(+h.qty||0)}});
  const crops=Object.entries(by).map(([crop,v])=>({crop,kg:r2(v.kg),pcs:r2(v.pcs),bundle:r2(v.bundle)})).sort((a,b)=>b.kg-a.kg||(b.pcs+b.bundle)-(a.pcs+a.bundle)).slice(0,10);
  return{year:S.cfg.currentYear||'',kg:r2(tk),dest:Object.fromEntries(Object.entries(dest).map(([k,v])=>[k,r2(v)])),crops,entries:H.length,updatedAt:Date.now()}}
const pushStats=async()=>{try{await setDoc(doc(db,'farmstats','summary'),calcStats())}catch(e){console.error(e)}};
function farmCard(){const f=S.fstats;if(!f||!f.entries)return'';
  return `<div class="card"><h2>Our farm${f.year?' \u00b7 '+yLabel(f.year):''}</h2><div class="kpi"><div><b>${f.kg}</b>kg harvested</div><div><b>${(f.dest&&f.dest.feeding)||0}</b>kg fed to scholars</div></div>${(f.crops||[]).slice(0,5).map(c=>`<div class="row sp"><span>${esc(c.crop)}</span><span class="mut">${qtyText(c)}</span></div>`).join('')}</div>`}
const cropsCat=()=>S.cfg.crops&&S.cfg.crops.length?S.cfg.crops:DEFCROPS;
function plantCard(id){const all=S.plant.filter(p=>p.hhId===id).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)),ok=all.filter(p=>p.status!=='pending'),pend=all.filter(p=>p.status==='pending'),g={};
  ok.forEach(p=>{const k=p.crop||p.note;g[k]=(g[k]||0)+(+p.qty||0)});
  const chips=Object.entries(g).map(([k,n])=>`<span class="sch" style="font-size:14px;padding:6px 12px">${esc(k)}${n?' \u00d7'+n:''}</span>`).join('');
  return `<div class="card"><div class="row sp"><h2 style="margin:0">What we planted</h2><button class="sm ghost" onclick="A.plantModal()">+ Add</button></div>${chips?`<div class="row" style="gap:8px;margin-top:10px">${chips}</div>`:'<p class="mut" style="margin:8px 0 0">Nothing yet. Tap + Add to tell us what your household planted.</p>'}${pend.length?`<p class="mut" style="margin:10px 0 0">Waiting for staff to check: ${pend.map(p=>esc(p.crop)+' \u00d7'+p.qty).join(', ')}</p>`:''}${all.length?`<details style="margin-top:10px"><summary style="min-height:48px;display:flex;align-items:center;color:var(--pri);cursor:pointer">See entries</summary>${all.slice(0,20).map(p=>`<div class="log row sp"><div><b>${esc(p.crop||p.note)}${p.qty?' \u00d7'+p.qty:''}</b><div class="mut">${fmtD(p.date)}${p.crop&&p.note?' \u00b7 '+esc(p.note):''}</div></div><button class="text" onclick="A.delPlant('${p.id}')" aria-label="Remove">\u2715</button></div>`).join('')}</details>`:''}</div>`}
function reviewCard(){const R_=S.plant.filter(p=>p.status==='pending');if(!R_.length)return'';
  return `<div class="card" style="border-left:4px solid var(--pend)"><h2>${R_.length} crop${R_.length>1?'s':''} to check</h2><p class="mut" style="margin-top:0">A household typed a crop that is not on the list. Add it to the list, or remove the entry.</p>${R_.map(p=>`<div class="log"><b>${esc(p.crop)} \u00d7${p.qty}</b><div class="mut">${esc(hhName(p.hhId))} \u00b7 ${fmtD(p.date)}${p.note?' \u00b7 '+esc(p.note):''}</div><div class="row" style="margin-top:6px"><button class="sm" onclick="A.approvePlant('${p.id}')">Add to list</button><button class="sm ghost" onclick="A.delPlant('${p.id}')">Remove</button></div></div>`).join('')}</div>`}
const plantRows=q=>cropsCat().map((c,i)=>({c,i})).filter(x=>!q||x.c.toLowerCase().includes(String(q).toLowerCase())).map(({c,i})=>`<div class="row sp" style="padding:4px 0;border-top:1px solid var(--line)"><span>${esc(c)}</span><span class="row" style="flex-wrap:nowrap;gap:6px"><button type="button" class="ghost" style="width:48px;padding:0;font-size:22px" aria-label="One less ${esc(c)}" onclick="A.pStep(${i},-1)">\u2212</button><b id="pc${i}" style="min-width:28px;text-align:center">${S.pd[c]||0}</b><button type="button" style="width:48px;padding:0;font-size:22px" aria-label="One more ${esc(c)}" onclick="A.pStep(${i},1)">+</button></span></div>`).join('')||'<p class="mut">No crops match.</p>';
function farmView(){const st=calcStats(),H=S.harv.filter(hInYear).sort((a,b)=>b.date>a.date?1:b.date<a.date?-1:(b.createdAt||0)-(a.createdAt||0)),P=S.plant.filter(p=>p.status!=='pending').sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0,15);
  return `<div class="row sp" style="margin-bottom:12px"><h2 style="margin:0">Farm records</h2><span class="row"><button class="ghost" onclick="A.plantModal()">+ Plantings</button><button onclick="A.harvestModal()">+ Harvest</button></span></div>
  <div class="card"><div class="kpi"><div><b>${st.kg}</b>kg harvested</div><div><b>${st.dest.feeding||0}</b>kg fed</div><div><b>${st.dest.sold||0}</b>kg sold</div><div><b>${st.entries}</b>harvest entries</div></div>${st.crops.map(c=>`<div class="row sp"><span>${esc(c.crop)}</span><span class="mut">${qtyText(c)}</span></div>`).join('')}</div>
  <div class="card"><h2>Recent harvests</h2>${H.slice(0,30).map(h=>`<div class="log row sp"><div><b>${esc(h.crop)} \u00b7 ${h.qty} ${h.unit==='pcs'?'pcs':h.unit==='bundle'?'bundles':'kg'}</b><div class="mut">${fmtD(h.date)} \u00b7 ${HDEST[h.dest]||''}${h.hhId?' \u00b7 '+esc(hhName(h.hhId)):''}${h.note?' \u00b7 '+esc(h.note):''}</div></div><button class="text" onclick="A.delHarvest('${h.id}')" aria-label="Delete">\u2715</button></div>`).join('')||'<p class="mut">No harvests recorded yet.</p>'}</div>
  ${reviewCard()}<div class="card"><h2>What households planted</h2>${P.map(p=>`<div class="log row sp"><div><b>${esc(p.crop||p.note)}${p.qty?' \u00d7'+p.qty:''}</b><div class="mut">${esc(hhName(p.hhId))} \u00b7 ${fmtD(p.date)}${p.crop&&p.note?' \u00b7 '+esc(p.note):''}</div></div><button class="text" onclick="A.delPlant('${p.id}')" aria-label="Delete">\u2715</button></div>`).join('')||'<p class="mut">Nothing yet.</p>'}</div>`}
Object.assign(A,{
 harvestModal(){open_(`<h2>Record a harvest</h2><label>Date</label><input id="hD" type="date" value="${ymd(new Date())}"><label>Crop</label><input id="hC" list="crops" placeholder="e.g. Okra" autocomplete="off"><datalist id="crops">${cropList().map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
  <div class="row" style="flex-wrap:nowrap"><div class="grow" style="min-width:0"><label>Amount</label><input id="hQ" type="number" step="0.01" inputmode="decimal"></div><div style="width:120px;flex:none"><label>Unit</label><select id="hU"><option value="kg">kg</option><option value="pcs">pieces</option><option value="bundle">bundles</option></select></div></div>
  <label>Where it went</label><select id="hW">${Object.entries(HDEST).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><label>Credit a household (optional)</label><select id="hH"><option value="">None</option>${Object.keys(S.hh).sort(natCmp).map(i=>`<option value="${i}">${i} \u00b7 ${esc(S.hh[i].name)}</option>`).join('')}</select>

});

 pickHh:id=>{S.claimSel=id;document.querySelectorAll('#cl .pick').forEach(b=>{const on=b.dataset.id===id;b.classList.toggle('on',on);b.setAttribute('aria-checked',on)});const b=$('#cb');if(b)b.disabled=false},
